name = "codex-downloads-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 每 10 分钟触发一次,直接抓取写 KV
[triggers]
crons = ["*/10 * * * *"]

# 与 Pages 项目使用同一个 KV namespace。
# 部署前把下面的 id 替换成 Cloudflare Dashboard 上 KV 列表里 CODEX_LINKS 的 ID。
[[kv_namespaces]]
binding = "CODEX_LINKS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
