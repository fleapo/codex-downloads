name: Deploy Cron Worker

# 触发条件:
# - push 到 main 分支且 worker-cron/ 或共享 lib 有改动
# - 或在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
    paths:
      - "worker-cron/**"
      - "functions/_lib/**"
      - ".github/workflows/deploy-cron.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: worker-cron/package-lock.json

      - name: Install dependencies
        working-directory: worker-cron
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-cron
          command: deploy
